# Génère le site et le publie sous nogues.app/or (hébergement web OVHcloud), en SFTP.
#
# Réglages (Settings > Secrets and variables > Actions de CE dépôt), jamais écrits ici :
#   secrets   OVH_SFTP_HOST      serveur FTP/SFTP de l'hébergement (onglet « FTP - SSH » de l'espace client)
#             OVH_SFTP_USER      login FTP (case SFTP cochée dans ce même onglet)
#             OVH_SFTP_PASSWORD  mot de passe FTP
#   variable  OVH_TARGET_DIR     dossier de destination (par défaut : www/or)
#
# Déclencheurs : chaque push sur main, lancement manuel, et deux fois par jour ouvré pour
# rafraîchir le cours de l'or affiché (data/cours.json).
# Alerte : au passage du cours au-dessus d'un seuil (variable OR_ALERTES, par défaut 120,125 €/g),
# une issue mentionnant le propriétaire est ouverte (notification e-mail), puis refermée sous le seuil.
# Sans les secrets, le site est généré et vérifié, mais rien n'est envoyé.
# Les fichiers sont ajoutés ou remplacés ; rien n'est supprimé sur le serveur.

name: Publier le site or

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      seuils:
        description: "Seuils d'alerte en €/g, séparés par des virgules (vide : valeur du dépôt)"
        required: false
        default: ""
      test:
        description: "Alerte de test (titre préfixé [Test])"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 1-5"    # 8h17 à Paris en heure d'été, 7h17 en hiver
    - cron: "47 15 * * 1-5"   # 17h47 à Paris en heure d'été, 16h47 en hiver (après le fixing de l'après-midi)

concurrency:
  group: deploy-or
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      LFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      TARGET_DIR: ${{ vars.OVH_TARGET_DIR || 'www/or' }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier le script de la page
        run: node --check site/assets/app.js && node --check site/assets/decor.js

      - name: Générer le site et relever le cours du jour
        run: |
          python3 scripts/build.py
          echo "Site généré : $(find dist -type f | wc -l) fichiers" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat dist/data/cours.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Alerte si le cours dépasse un seuil
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SEUILS: ${{ inputs.seuils || vars.OR_ALERTES || '120,125' }}
          ALERTE_TEST: ${{ inputs.test && '1' || '' }}
        run: python3 scripts/alerte.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Vérifier la configuration de publication
        id: check
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::warning::Secrets OVH_SFTP_HOST, OVH_SFTP_USER ou OVH_SFTP_PASSWORD absents de ce dépôt : site généré mais pas publié."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${TARGET_DIR%/}" in
            ""|"."|"/"|"www")
              echo "::error::Dossier cible refusé (« $TARGET_DIR ») : indiquez www/or."
              exit 1 ;;
          esac
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Installer lftp
        if: steps.check.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer dist/ en SFTP
        if: steps.check.outputs.ready == 'true'
        run: |
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:timeout 20; set net:max-retries 3; set net:reconnect-interval-base 5;
            mkdir -p -f '$TARGET_DIR';
            mirror --reverse --parallel=4 dist/ '$TARGET_DIR';
            cls -1 '$TARGET_DIR';
            bye"
          echo "Publication terminée dans $TARGET_DIR : https://nogues.app/or/" >> "$GITHUB_STEP_SUMMARY"
